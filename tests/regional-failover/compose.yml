name: netbird-lab

x-peer: &peer
  image: netbirdio/netbird:0.82.1@sha256:335e5df5bcf8a14be6a80b28d67da129a5b05c252641edb2e99380aa410e38c7
  restart: unless-stopped
  mem_limit: 512m
  pids_limit: 256
  cap_add: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
  devices: [/dev/net/tun:/dev/net/tun]
  environment:
    NB_SETUP_KEY: ${NB_SETUP_KEY:?lab enrollment required}
    NB_MANAGEMENT_URL: ${NETBIRD_URL:?management URL required}
    NB_DISABLE_DNS: "true"
    NB_LOG_LEVEL: warn
    NB_LOG_FILE: console
  networks: [lab]

services:
  peer-a:
    <<: *peer
    hostname: netbird-lab-a
    volumes:
      - /mnt/data/netbird/lab/peer-a:/var/lib/netbird
  peer-b:
    <<: *peer
    hostname: netbird-lab-b
    volumes:
      - /mnt/data/netbird/lab/peer-b:/var/lib/netbird
  echo:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ecc
    restart: unless-stopped
    network_mode: service:peer-b
    depends_on: [peer-b]
    command: [/bin/sh, -ec, 'mkdir -p /www; printf netbird-lab-ok > /www/index.html; exec httpd -f -p 8080 -h /www']

networks:
  lab:
    driver: bridge

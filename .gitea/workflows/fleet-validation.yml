# Managed fleet baseline; project checks remain in .ci/validation.json.
name: fleet-validation
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: catthehacker/ubuntu:act-22.04
      options: --memory=4g --memory-swap=4g --cpus=2 --pids-limit=512
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - uses: https://github.com/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0, upstream pin
        with:
          go-version: "1.26.10"
          cache: false
      - run: python3 .ci/validate.py
  secret-scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: catthehacker/ubuntu:act-22.04
      options: --memory=4g --memory-swap=4g --cpus=2 --pids-limit=512
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check committed source with pinned scanner
        run: python3 .ci/gitleaks.py
